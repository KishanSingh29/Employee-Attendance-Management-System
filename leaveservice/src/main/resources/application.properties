spring.application.name=leaveservice
server.port=8083

# ===== Datasource =====
spring.datasource.url=jdbc:mysql://localhost:3306/leaveservice_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===== JWT (validation only - tokens are issued by authservice) =====
jwt.secret=mySecretKey123456789012345678901234567890

# ===== Leave policy =====
leave.paid-total=12
leave.sick-total=6
leave.monthly-salary=30000
leave.working-days-per-month=30

# ===== Kafka (consumer) =====
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=leave-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.attendance.leaveservice.event.UserRegisteredEvent
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.topic.user-registered=user-registered

# ===== Swagger / OpenAPI =====
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# ===== Error handling =====
server.error.include-message=always
server.error.include-binding-errors=always
