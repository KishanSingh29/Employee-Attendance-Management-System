<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Leaves · AttendTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="brand">🏢 AttendTrack</div>
    <a href="employee-dashboard.html"><span class="nav-icon">📊</span>Dashboard</a>
    <a href="employee-attendance.html"><span class="nav-icon">🕒</span>Attendance</a>
    <a href="employee-leaves.html" class="active"><span class="nav-icon">🌴</span>Leaves</a>
    <a href="#" onclick="doLogout();return false;"><span class="nav-icon">🚪</span>Logout</a>
  </div>

  <div class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary btn-sm sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="fw-bold">🏢 AttendTrack</span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold" id="topName"></span>
        <span class="badge bg-primary" id="topEmpId"></span>
      </div>
    </div>

    <h4 class="mb-3">My Leaves</h4>

    <!-- Balance -->
    <div class="row g-3 mb-4">
      <div class="col-md-4">
        <div class="card h-100"><div class="card-body">
          <h6 class="text-muted">Paid Leave (PL)</h6>
          <div class="d-flex justify-content-between small mb-1">
            <span id="plText">-</span><span id="plRemainText"></span>
          </div>
          <div class="progress" style="height:14px;">
            <div id="plBar" class="progress-bar bg-primary" style="width:0%"></div>
          </div>
        </div></div>
      </div>
      <div class="col-md-4">
        <div class="card h-100"><div class="card-body">
          <h6 class="text-muted">Sick Leave (SL)</h6>
          <div class="d-flex justify-content-between small mb-1">
            <span id="slText">-</span><span id="slRemainText"></span>
          </div>
          <div class="progress" style="height:14px;">
            <div id="slBar" class="progress-bar bg-warning" style="width:0%"></div>
          </div>
        </div></div>
      </div>
      <div class="col-md-4">
        <div class="card stat-card b-danger h-100"><div class="card-body">
          <div class="stat-label">This Month Deduction</div>
          <div class="stat-value" id="deductionAmt">₹0</div>
          <div class="text-muted small" id="deductionMeta"></div>
        </div></div>
      </div>
    </div>

    <!-- Apply -->
    <div class="card mb-4">
      <div class="card-body">
        <h5 class="card-title mb-3">Apply for Leave</h5>
        <div id="applyErr" class="alert alert-danger d-none"></div>
        <form id="applyForm">
          <div class="row g-3">
            <div class="col-md-3">
              <label class="form-label" for="leaveType">Leave Type</label>
              <select id="leaveType" class="form-select" required>
                <option value="PAID">Paid</option>
                <option value="SICK">Sick</option>
                <option value="UNPAID">Unpaid</option>
              </select>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="startDate">Start Date</label>
              <input type="date" id="startDate" class="form-control" required>
            </div>
            <div class="col-md-3">
              <label class="form-label" for="endDate">End Date</label>
              <input type="date" id="endDate" class="form-control" required>
            </div>
            <div class="col-md-3 d-flex align-items-end">
              <button type="submit" id="applyBtn" class="btn btn-primary w-100">Submit Request</button>
            </div>
            <div class="col-12">
              <label class="form-label" for="reason">Reason</label>
              <textarea id="reason" class="form-control" rows="2" maxlength="500" placeholder="Optional note for your manager"></textarea>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Requests -->
    <div class="card">
      <div class="card-body">
        <h5 class="card-title mb-3">My Leave Requests</h5>
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Reason</th><th>Status</th><th>Action</th></tr>
            </thead>
            <tbody id="leaveBody">
              <tr><td colspan="7" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    checkAuth();
    fillTopbar();

    const applyErr = document.getElementById("applyErr");

    async function loadBalance() {
      try {
        const b = await getLeaveBalance(getCurrentYear());
        if (!b) return;
        const plPct = b.plTotal ? Math.min(100, (b.plUsed / b.plTotal) * 100) : 0;
        const slPct = b.slTotal ? Math.min(100, (b.slUsed / b.slTotal) * 100) : 0;
        document.getElementById("plText").textContent = `${b.plUsed} / ${b.plTotal} used`;
        document.getElementById("slText").textContent = `${b.slUsed} / ${b.slTotal} used`;
        document.getElementById("plRemainText").textContent = `${b.plRemaining} left`;
        document.getElementById("slRemainText").textContent = `${b.slRemaining} left`;
        document.getElementById("plBar").style.width = plPct + "%";
        document.getElementById("slBar").style.width = slPct + "%";
      } catch (err) {
        showToast(apiError(err), "danger");
      }
    }

    async function loadDeduction() {
      try {
        const d = await getLeaveDeduction(getCurrentMonth(), getCurrentYear());
        if (!d) return;
        document.getElementById("deductionAmt").textContent = "₹" + Number(d.totalDeduction ?? 0).toLocaleString("en-IN");
        document.getElementById("deductionMeta").textContent =
          `${d.unpaidDays ?? 0} unpaid day(s) · ₹${Number(d.deductionPerDay ?? 0).toLocaleString("en-IN")}/day`;
      } catch (err) {
        document.getElementById("deductionMeta").textContent = apiError(err);
      }
    }

    async function loadLeaves() {
      const body = document.getElementById("leaveBody");
      try {
        const rows = await getMyLeaves();
        if (!rows || !rows.length) {
          body.innerHTML = `<tr><td colspan="7" class="empty-state">No leave requests yet.</td></tr>`;
          return;
        }
        rows.sort((a, b) => (a.startDate < b.startDate ? 1 : -1));
        body.innerHTML = rows.map(r => `
          <tr>
            <td>${r.leaveType}</td>
            <td>${formatDate(r.startDate)}</td>
            <td>${formatDate(r.endDate)}</td>
            <td>${r.totalDays}</td>
            <td>${r.reason ? r.reason : "-"}</td>
            <td>${getStatusBadge(r.status)}</td>
            <td>${r.status === "PENDING"
              ? `<button class="btn btn-sm btn-outline-danger" data-cancel="${r.id}">Cancel</button>`
              : "-"}</td>
          </tr>`).join("");
        body.querySelectorAll("[data-cancel]").forEach(btn => {
          btn.addEventListener("click", () => cancelReq(btn.getAttribute("data-cancel"), btn));
        });
      } catch (err) {
        body.innerHTML = `<tr><td colspan="7" class="empty-state">${apiError(err)}</td></tr>`;
      }
    }

    async function cancelReq(id, btn) {
      if (!confirm("Cancel this leave request?")) return;
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span>`;
      try {
        const res = await cancelLeave(id);
        showToast(res?.message || "Leave request cancelled", "success");
      } catch (err) {
        showToast(apiError(err), "danger");
      }
      loadLeaves(); loadBalance(); loadDeduction();
    }

    document.getElementById("applyForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      applyErr.classList.add("d-none");
      const body = {
        leaveType: document.getElementById("leaveType").value,
        startDate: document.getElementById("startDate").value,
        endDate: document.getElementById("endDate").value,
        reason: document.getElementById("reason").value.trim()
      };
      if (!body.startDate || !body.endDate) {
        applyErr.textContent = "Please choose start and end dates.";
        applyErr.classList.remove("d-none");
        return;
      }
      if (body.endDate < body.startDate) {
        applyErr.textContent = "End date cannot be before start date.";
        applyErr.classList.remove("d-none");
        return;
      }
      showLoading("applyBtn", "Submitting...");
      try {
        const res = await applyLeave(body);
        showToast(res?.message || "Leave request submitted", "success");
        document.getElementById("applyForm").reset();
      } catch (err) {
        applyErr.textContent = apiError(err);
        applyErr.classList.remove("d-none");
      }
      hideLoading("applyBtn", "Submit Request");
      loadLeaves(); loadBalance(); loadDeduction();
    });

    loadBalance();
    loadDeduction();
    loadLeaves();
  </script>
</body>
</html>
