<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register · AttendTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card p-4 p-md-5 my-4">
      <div class="brand mb-1">🏢 AttendTrack</div>
      <p class="text-center text-muted mb-4">Create your account</p>

      <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>
      <div id="okMsg" class="alert alert-success d-none" role="alert"></div>

      <form id="registerForm" novalidate>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label" for="firstName">First Name</label>
            <input type="text" class="form-control" id="firstName" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="lastName">Last Name</label>
            <input type="text" class="form-control" id="lastName" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="email">Email</label>
            <input type="email" class="form-control" id="email" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="password">Password</label>
            <input type="password" class="form-control" id="password" minlength="8" required>
            <div class="form-text">At least 8 characters.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="confirmPassword">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" required>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="role">Role</label>
            <select class="form-select" id="role" required>
              <option value="EMPLOYEE" selected>Employee</option>
              <option value="HR">HR</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="department">Department</label>
            <select class="form-select" id="department" required>
              <option value="IT" selected>IT</option>
              <option value="HR">HR</option>
              <option value="Sales">Sales</option>
              <option value="Finance">Finance</option>
              <option value="Operations">Operations</option>
            </select>
          </div>
        </div>
        <button type="submit" id="registerBtn" class="btn btn-primary btn-lg w-100 mt-4">Register</button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        Already registered? <a href="login.html">Sign in</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    if (getToken()) {
      window.location.href = getRole() === "HR" ? "hr-dashboard.html" : "employee-dashboard.html";
    }

    const errBox = document.getElementById("errorMsg");
    const okBox = document.getElementById("okMsg");

    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.add("d-none");
      okBox.classList.add("d-none");

      const body = {
        firstName: document.getElementById("firstName").value.trim(),
        lastName: document.getElementById("lastName").value.trim(),
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value,
        role: document.getElementById("role").value,
        department: document.getElementById("department").value
      };
      const confirm = document.getElementById("confirmPassword").value;

      if (!body.firstName || !body.lastName || !body.email || !body.password) {
        errBox.textContent = "Please fill in all fields.";
        errBox.classList.remove("d-none");
        return;
      }
      if (body.password.length < 8) {
        errBox.textContent = "Password must be at least 8 characters.";
        errBox.classList.remove("d-none");
        return;
      }
      if (body.password !== confirm) {
        errBox.textContent = "Passwords do not match.";
        errBox.classList.remove("d-none");
        return;
      }

      showLoading("registerBtn", "Creating account...");
      try {
        await registerEmployee(body);
        okBox.textContent = "Account created! Redirecting to login...";
        okBox.classList.remove("d-none");
        setTimeout(() => window.location.href = "login.html", 1200);
      } catch (err) {
        errBox.textContent = apiError(err);
        errBox.classList.remove("d-none");
        hideLoading("registerBtn", "Register");
      }
    });
  </script>
</body>
</html>
