<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendance Report · AttendTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="brand">🏢 AttendTrack</div>
    <a href="hr-dashboard.html"><span class="nav-icon">📊</span>Dashboard</a>
    <a href="hr-employees.html"><span class="nav-icon">👥</span>Employees</a>
    <a href="hr-leaves.html"><span class="nav-icon">🌴</span>Leaves</a>
    <a href="hr-attendance-report.html" class="active"><span class="nav-icon">📈</span>Reports</a>
    <a href="#" onclick="doLogout();return false;"><span class="nav-icon">🚪</span>Logout</a>
  </div>

  <div class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary btn-sm sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="fw-bold">🏢 AttendTrack <span class="badge bg-primary ms-1">HR</span></span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold" id="topName"></span>
        <span class="badge bg-primary" id="topEmpId"></span>
      </div>
    </div>

    <h4 class="mb-3">Monthly Attendance Report</h4>

    <div class="card mb-4">
      <div class="card-body">
        <div class="row g-3 align-items-end">
          <div class="col-6 col-md-3">
            <label class="form-label" for="month">Month</label>
            <select id="month" class="form-select"></select>
          </div>
          <div class="col-6 col-md-3">
            <label class="form-label" for="year">Year</label>
            <select id="year" class="form-select"></select>
          </div>
          <div class="col-12 col-md-3">
            <button id="applyFilter" class="btn btn-primary w-100">Apply</button>
          </div>
          <div class="col-12 col-md-3">
            <button id="exportBtn" class="btn btn-success w-100">Export CSV</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle" id="reportTable">
            <thead class="table-light">
              <tr><th>Name</th><th>EMP ID</th><th>Present</th><th>Absent</th><th>Late</th><th>Half Day</th><th>Hours</th></tr>
            </thead>
            <tbody id="reportBody">
              <tr><td colspan="7" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    checkAuth();
    checkHR();
    fillTopbar();

    let reportData = [];

    document.getElementById("month").innerHTML = monthOptions(getCurrentMonth());
    document.getElementById("year").innerHTML = yearOptions(getCurrentYear());

    async function loadReport() {
      const body = document.getElementById("reportBody");
      body.innerHTML = `<tr><td colspan="7" class="empty-state">Loading...</td></tr>`;
      const m = document.getElementById("month").value;
      const y = document.getElementById("year").value;
      try {
        reportData = await hrGetReport(m, y) || [];
        if (!reportData.length) {
          body.innerHTML = `<tr><td colspan="7" class="empty-state">No report data for this period.</td></tr>`;
          return;
        }
        body.innerHTML = reportData.map(r => `
          <tr>
            <td>${[r.firstName, r.lastName].filter(Boolean).join(" ") || "-"}</td>
            <td>${r.employeeId || "-"}</td>
            <td>${r.totalPresent ?? 0}</td>
            <td>${r.totalAbsent ?? 0}</td>
            <td>${r.totalLate ?? 0}</td>
            <td>${r.totalHalfDay ?? 0}</td>
            <td>${Number(r.totalWorkingHours ?? 0).toFixed(2)}</td>
          </tr>`).join("");
      } catch (err) {
        body.innerHTML = `<tr><td colspan="7" class="empty-state">${apiError(err)}</td></tr>`;
      }
    }

    function exportCSV() {
      if (!reportData.length) { showToast("Nothing to export.", "warning"); return; }
      const m = document.getElementById("month").value;
      const y = document.getElementById("year").value;
      const header = ["Name", "EMP ID", "Present", "Absent", "Late", "Half Day", "Total Hours", "Avg Hours"];
      const lines = [header.join(",")];
      reportData.forEach(r => {
        const name = [r.firstName, r.lastName].filter(Boolean).join(" ");
        const row = [
          name, r.employeeId || "",
          r.totalPresent ?? 0, r.totalAbsent ?? 0, r.totalLate ?? 0, r.totalHalfDay ?? 0,
          Number(r.totalWorkingHours ?? 0).toFixed(2), Number(r.averageHours ?? 0).toFixed(2)
        ].map(v => `"${String(v).replace(/"/g, '""')}"`);
        lines.push(row.join(","));
      });
      const blob = new Blob([lines.join("\n")], { type: "text/csv;charset=utf-8;" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = `attendance-report-${y}-${String(m).padStart(2, "0")}.csv`;
      document.body.appendChild(link);
      link.click();
      link.remove();
    }

    document.getElementById("applyFilter").addEventListener("click", loadReport);
    document.getElementById("month").addEventListener("change", loadReport);
    document.getElementById("year").addEventListener("change", loadReport);
    document.getElementById("exportBtn").addEventListener("click", exportCSV);

    loadReport();
  </script>
</body>
</html>
