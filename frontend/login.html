<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · AttendTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card p-4 p-md-5">
      <div class="brand mb-1">🏢 AttendTrack</div>
      <p class="text-center text-muted mb-4">Sign in to your account</p>

      <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>

      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control form-control-lg" id="email" placeholder="you@company.com" required>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control form-control-lg" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-lg w-100">Login</button>
      </form>

      <p class="text-center text-muted mt-4 mb-0">
        Don't have an account? <a href="register.html">Create one</a>
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    // Already logged in -> go straight to the right dashboard.
    if (getToken()) {
      window.location.href = getRole() === "HR" ? "hr-dashboard.html" : "employee-dashboard.html";
    }

    const errBox = document.getElementById("errorMsg");

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      errBox.classList.add("d-none");

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      if (!email || !password) {
        errBox.textContent = "Please enter your email and password.";
        errBox.classList.remove("d-none");
        return;
      }

      showLoading("loginBtn", "Signing in...");
      try {
        const data = await loginEmployee({ email, password });
        saveTokens(data);
        window.location.href = data.role === "HR" ? "hr-dashboard.html" : "employee-dashboard.html";
      } catch (err) {
        errBox.textContent = apiError(err);
        errBox.classList.remove("d-none");
        hideLoading("loginBtn", "Login");
      }
    });
  </script>
</body>
</html>
