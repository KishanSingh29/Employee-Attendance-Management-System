<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Employees · AttendTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="brand">🏢 AttendTrack</div>
    <a href="hr-dashboard.html"><span class="nav-icon">📊</span>Dashboard</a>
    <a href="hr-employees.html" class="active"><span class="nav-icon">👥</span>Employees</a>
    <a href="hr-leaves.html"><span class="nav-icon">🌴</span>Leaves</a>
    <a href="hr-attendance-report.html"><span class="nav-icon">📈</span>Reports</a>
    <a href="#" onclick="doLogout();return false;"><span class="nav-icon">🚪</span>Logout</a>
  </div>

  <div class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary btn-sm sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="fw-bold">🏢 AttendTrack <span class="badge bg-primary ms-1">HR</span></span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold" id="topName"></span>
        <span class="badge bg-primary" id="topEmpId"></span>
      </div>
    </div>

    <h4 class="mb-3">Employees</h4>

    <div class="card mb-4">
      <div class="card-body">
        <input type="text" id="search" class="form-control" placeholder="Search by name, email or department...">
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr><th>EMP ID</th><th>Name</th><th>Email</th><th>Department</th><th>Role</th><th>Action</th></tr>
            </thead>
            <tbody id="empBody">
              <tr><td colspan="6" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Attendance modal -->
  <div class="modal fade" id="attModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="attModalTitle">Attendance</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-2 mb-3">
            <div class="col-6"><select id="mMonth" class="form-select form-select-sm"></select></div>
            <div class="col-6"><select id="mYear" class="form-select form-select-sm"></select></div>
          </div>
          <div class="table-responsive">
            <table class="table table-sm table-hover align-middle">
              <thead class="table-light">
                <tr><th>Date</th><th>Check In</th><th>Check Out</th><th>Hours</th><th>Status</th></tr>
              </thead>
              <tbody id="mBody">
                <tr><td colspan="5" class="empty-state">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    checkAuth();
    checkHR();
    fillTopbar();

    const attModal = new bootstrap.Modal(document.getElementById("attModal"));
    let allEmployees = [];
    let currentUserId = null;

    document.getElementById("mMonth").innerHTML = monthOptions(getCurrentMonth());
    document.getElementById("mYear").innerHTML = yearOptions(getCurrentYear());

    function render(list) {
      const body = document.getElementById("empBody");
      if (!list.length) {
        body.innerHTML = `<tr><td colspan="6" class="empty-state">No employees found.</td></tr>`;
        return;
      }
      body.innerHTML = list.map(e => `
        <tr>
          <td>${e.employeeId || "-"}</td>
          <td>${[e.firstName, e.lastName].filter(Boolean).join(" ") || "-"}</td>
          <td>${e.email || "-"}</td>
          <td>${e.department || "-"}</td>
          <td><span class="badge ${e.role === "HR" ? "bg-primary" : "bg-secondary"}">${e.role}</span></td>
          <td><button class="btn btn-sm btn-outline-primary"
                data-view="${e.userId}"
                data-name="${[e.firstName, e.lastName].filter(Boolean).join(" ")}">View Attendance</button></td>
        </tr>`).join("");
      body.querySelectorAll("[data-view]").forEach(b =>
        b.addEventListener("click", () => openAttendance(b.getAttribute("data-view"), b.getAttribute("data-name"))));
    }

    async function loadEmployees() {
      const body = document.getElementById("empBody");
      try {
        allEmployees = await getAllEmployees() || [];
        render(allEmployees);
      } catch (err) {
        body.innerHTML = `<tr><td colspan="6" class="empty-state">${apiError(err)}</td></tr>`;
      }
    }

    document.getElementById("search").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      render(allEmployees.filter(emp =>
        [emp.firstName, emp.lastName, emp.email, emp.department, emp.employeeId]
          .filter(Boolean).join(" ").toLowerCase().includes(q)));
    });

    function openAttendance(userId, name) {
      currentUserId = userId;
      document.getElementById("attModalTitle").textContent = `Attendance — ${name || userId}`;
      attModal.show();
      loadModalAttendance();
    }

    async function loadModalAttendance() {
      const body = document.getElementById("mBody");
      body.innerHTML = `<tr><td colspan="5" class="empty-state">Loading...</td></tr>`;
      const m = document.getElementById("mMonth").value;
      const y = document.getElementById("mYear").value;
      try {
        const rows = await hrGetEmployeeAttendance(currentUserId, m, y);
        if (!rows || !rows.length) {
          body.innerHTML = `<tr><td colspan="5" class="empty-state">No records for this period.</td></tr>`;
          return;
        }
        rows.sort((a, b) => (a.date < b.date ? 1 : -1));
        body.innerHTML = rows.map(r => `
          <tr class="row-${(r.status || '').toLowerCase()}">
            <td>${formatDate(r.date)}</td>
            <td>${formatTime(r.checkIn)}</td>
            <td>${formatTime(r.checkOut)}</td>
            <td>${r.workingHours != null ? Number(r.workingHours).toFixed(2) : "-"}</td>
            <td>${getStatusBadge(r.status)}</td>
          </tr>`).join("");
      } catch (err) {
        body.innerHTML = `<tr><td colspan="5" class="empty-state">${apiError(err)}</td></tr>`;
      }
    }

    document.getElementById("mMonth").addEventListener("change", loadModalAttendance);
    document.getElementById("mYear").addEventListener("change", loadModalAttendance);

    loadEmployees();
  </script>
</body>
</html>
