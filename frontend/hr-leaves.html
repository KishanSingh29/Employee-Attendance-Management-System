<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Leave Requests · AttendTrack</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="brand">🏢 AttendTrack</div>
    <a href="hr-dashboard.html"><span class="nav-icon">📊</span>Dashboard</a>
    <a href="hr-employees.html"><span class="nav-icon">👥</span>Employees</a>
    <a href="hr-leaves.html" class="active"><span class="nav-icon">🌴</span>Leaves</a>
    <a href="hr-attendance-report.html"><span class="nav-icon">📈</span>Reports</a>
    <a href="#" onclick="doLogout();return false;"><span class="nav-icon">🚪</span>Logout</a>
  </div>

  <div class="main-content">
    <div class="topbar">
      <div class="d-flex align-items-center gap-2">
        <button class="btn btn-outline-secondary btn-sm sidebar-toggle" onclick="toggleSidebar()">☰</button>
        <span class="fw-bold">🏢 AttendTrack <span class="badge bg-primary ms-1">HR</span></span>
      </div>
      <div class="d-flex align-items-center gap-3">
        <span class="fw-semibold" id="topName"></span>
        <span class="badge bg-primary" id="topEmpId"></span>
      </div>
    </div>

    <h4 class="mb-3">Leave Requests</h4>

    <ul class="nav nav-pills mb-3" id="tabs">
      <li class="nav-item"><button class="nav-link active" data-status="">All</button></li>
      <li class="nav-item"><button class="nav-link" data-status="PENDING">Pending</button></li>
      <li class="nav-item"><button class="nav-link" data-status="APPROVED">Approved</button></li>
      <li class="nav-item"><button class="nav-link" data-status="REJECTED">Rejected</button></li>
    </ul>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr><th>Employee</th><th>Type</th><th>Start</th><th>End</th><th>Days</th><th>Reason</th><th>Status</th><th>Actions</th></tr>
            </thead>
            <tbody id="leaveBody">
              <tr><td colspan="8" class="empty-state">Loading...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Reject modal -->
  <div class="modal fade" id="rejectModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Reject Leave Request</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <label class="form-label" for="rejectReason">Reason for rejection</label>
          <textarea id="rejectReason" class="form-control" rows="3" maxlength="500"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" id="confirmReject" class="btn btn-danger">Reject</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script>
    checkAuth();
    checkHR();
    fillTopbar();

    const rejectModal = new bootstrap.Modal(document.getElementById("rejectModal"));
    let rejectId = null;
    let currentStatus = "";

    async function load(status) {
      currentStatus = status;
      const body = document.getElementById("leaveBody");
      body.innerHTML = `<tr><td colspan="8" class="empty-state">Loading...</td></tr>`;
      try {
        const rows = await hrGetAllLeaves(status || undefined);
        if (!rows || !rows.length) {
          body.innerHTML = `<tr><td colspan="8" class="empty-state">No leave requests${status ? " with status " + status : ""}.</td></tr>`;
          return;
        }
        rows.sort((a, b) => (a.appliedAt < b.appliedAt ? 1 : -1));
        body.innerHTML = rows.map(r => `
          <tr>
            <td>${[r.firstName, r.lastName].filter(Boolean).join(" ") || r.employeeId || r.userId}</td>
            <td>${r.leaveType}</td>
            <td>${formatDate(r.startDate)}</td>
            <td>${formatDate(r.endDate)}</td>
            <td>${r.totalDays}</td>
            <td>${r.reason || "-"}</td>
            <td>${getStatusBadge(r.status)}</td>
            <td class="text-nowrap">${r.status === "PENDING" ? `
              <button class="btn btn-sm btn-success me-1" data-approve="${r.id}">Approve</button>
              <button class="btn btn-sm btn-outline-danger" data-reject="${r.id}">Reject</button>` : "-"}</td>
          </tr>`).join("");
        body.querySelectorAll("[data-approve]").forEach(b =>
          b.addEventListener("click", () => approve(b.getAttribute("data-approve"), b)));
        body.querySelectorAll("[data-reject]").forEach(b =>
          b.addEventListener("click", () => { rejectId = b.getAttribute("data-reject"); document.getElementById("rejectReason").value = ""; rejectModal.show(); }));
      } catch (err) {
        body.innerHTML = `<tr><td colspan="8" class="empty-state">${apiError(err)}</td></tr>`;
      }
    }

    async function approve(id, btn) {
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span>`;
      try {
        const res = await hrApproveLeave(id);
        showToast(res?.message || "Leave approved", "success");
      } catch (err) {
        showToast(apiError(err), "danger");
      }
      load(currentStatus);
    }

    document.getElementById("confirmReject").addEventListener("click", async () => {
      const reason = document.getElementById("rejectReason").value.trim();
      if (!reason) { showToast("Please enter a reason.", "warning"); return; }
      showLoading("confirmReject", "Rejecting...");
      try {
        const res = await hrRejectLeave(rejectId, reason);
        showToast(res?.message || "Leave rejected", "success");
        rejectModal.hide();
      } catch (err) {
        showToast(apiError(err), "danger");
      }
      hideLoading("confirmReject", "Reject");
      load(currentStatus);
    });

    document.querySelectorAll("#tabs button").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("#tabs button").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        load(btn.getAttribute("data-status"));
      });
    });

    load("");
  </script>
</body>
</html>
